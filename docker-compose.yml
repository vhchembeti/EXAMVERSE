# docker-compose.yml
# Production & Local Unified Multi-Container Architecture for EXAMVERSE
# Includes Frontend/API Express Service and Optional PostgreSQL Fallback

version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: examverse-platform
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - APP_URL=http://localhost:5000
      - ENCRYPTION_MASTER_KEY=examverse_master_kek_32bytes_sec_2026!
      - BLIND_INDEX_SALT=examverse_blind_index_salt_2026
      - DATABASE_URL=postgresql://examverse_user:examverse_secure_pass_2026@postgres:5432/examverse_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - examverse-network

  postgres:
    image: postgres:16-alpine
    container_name: examverse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: examverse_user
      POSTGRES_PASSWORD: examverse_secure_pass_2026
      POSTGRES_DB: examverse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examverse_user -d examverse_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - examverse-network

networks:
  examverse-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
