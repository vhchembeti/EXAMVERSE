services:
  - type: web
    name: examverse-platform
    env: node
    plan: free
    region: oregon
    autoDeploy: false
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: ENCRYPTION_MASTER_KEY
        generateValue: true
      - key: ADMIN_SECRET_KEY
        generateValue: true
      - key: MONITORING_WEBHOOK_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
